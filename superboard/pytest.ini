; pytest-Konfiguration der Board-Suite.
;
; Warum es diese Datei gibt (28.07.2026):
; pytest lädt installierte Plugins automatisch. Im User-site-packages liegt `langsmith`
; mit einem pytest-Plugin, das beim Laden `pydantic` importiert — und dessen kompilierte
; `pydantic_core.so` ist arm64-only. Läuft Python im x86_64-Modus, scheitert der Import,
; und pytest stirbt in der Kommandozeilen-Phase, BEVOR ein Test eingesammelt wird.
;
; Der Auslöser ist unscheinbar: `/usr/local/bin/timeout` ist ein Intel-Binary (Homebrew
; unter /usr/local statt /opt/homebrew). Ein `timeout 900 python3 -m pytest …` zwingt den
; Universal-Binary-Python damit in den x86_64-Modus — ohne Präfix läuft derselbe Python
; als arm64 und alles ist grün. Gemessen: `timeout 30 python3 -c "platform.machine()"`
; -> x86_64, ohne timeout -> arm64.
;
; Das Fatale daran ist nicht der Fehler, sondern wie er aussieht: ein Traceback durch
; pydantic/langsmith, kein einziger Test gelaufen — das liest sich wie „die Board-Suite
; ist kaputt", ist aber ein Umgebungsproblem ohne jeden Bezug zum Board. Die Zeile unten
; nimmt dem Plugin die Gelegenheit; die Suite braucht es nicht.
;
; Wenn die Suite eines Tages ein echtes pytest-Plugin braucht, hier ergänzen — nicht
; global etwas installieren.

; Zweiter Grund (12.08.2026): seit dem Codex-Runner liegt unter `codex-home/` ein
; generiertes CODEX_HOME. Codex lädt sich dorthin Plugin-Pakete von OpenAI in einen
; Cache — samt deren eigener pytest-Dateien. Ein nacktes `pytest` in diesem Ordner
; sammelte sie mit und meldete 2 rote Tests, die mit dem Board nichts zu tun haben
; (und die Nacht-Wache `check_todo_board_tests` dauerhaft rot gefärbt hätten).
; `codex-home/` ist generiert und gitignored — hier gehört nichts eingesammelt.

[pytest]
addopts = -p no:langsmith_plugin
norecursedirs = codex-home
